name: BATS testsuite

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  docker-bats:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Build CI container
        run: |
          docker build \
            -f .github/docker/ceasar-ci.Dockerfile \
            -t ceasar-ci:${{ github.sha }} \
            .

      - name: Build pinned package environment
        run: |
          docker build --pull=false \
            -f .github/docker/ceasar-package.Dockerfile \
            -t ceasar-package-builder:${{ github.sha }} \
            .

      - name: Build four local Ceasar packages
        run: |
          mkdir -p dist/debs
          docker run --rm \
            --name "ceasar-bats-package-build-${GITHUB_RUN_ID}" \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e BUILD_DIR=/tmp/ceasar-build \
            -e DEB_DIR=/out \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "${GITHUB_WORKSPACE}/dist/debs:/out" \
            ceasar-package-builder:${{ github.sha }} \
            bash -lc 'cd /src/src && bash ./ceasar_autocompile.sh --all --noinstall "~localsrc"'

      - name: Start CI container
        run: |
          docker run -d \
            --name ceasar-ci \
            --hostname ceasar-dev.local \
            --privileged \
            --cgroupns=host \
            --tmpfs /run \
            --tmpfs /run/lock \
            --tmpfs /tmp:exec,mode=1777 \
            --dns 8.8.8.8 \
            --dns 8.8.4.4 \
            --dns 2001:4860:4860::8888 \
            --dns 2001:4860:4860::8844 \
            -e TZ=UTC \
            -e LANG=en_US.UTF-8 \
            -e LC_ALL=en_US.UTF-8 \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "${GITHUB_WORKSPACE}:/ceasar-git" \
            -w /ceasar-git \
            ceasar-ci:${{ github.sha }}
          for _ in {1..100}; do
            docker exec ceasar-ci bash -lc 'systemctl is-system-running 2>/dev/null | grep -Eq "running|degraded"' && break
            sleep 0.1
          done

      - name: Install Ceasar from local git
        run: |
          docker exec ceasar-ci bash -lc '
            set -euxo pipefail
            export TERM=xterm
            DEB_PATH=/ceasar-git/dist/debs
            for package in ceasar ceasar-nginx ceasar-php ceasar-web-terminal; do
              test "$(find "${DEB_PATH}" -maxdepth 1 -type f -name "${package}_*.deb" | wc -l)" -eq 1
            done

            # The local-package path still verifies the configured update key and
            # repository. Serve a minimal loopback fixture so this pre-release test
            # does not depend on the already-published Pages state.
            APT_FIXTURE=/tmp/ceasar-apt-fixture
            install -d "${APT_FIXTURE}/dists/noble"
            printf "%s\n" "Origin: Ceasar CI" "Codename: noble" >"${APT_FIXTURE}/dists/noble/Release"
            gpg --batch --yes --dearmor \
              --output "${APT_FIXTURE}/ceasar-archive-keyring.gpg" \
              /ceasar-git/release/ceasar-archive-keyring.asc
            python3 -m http.server 18080 --bind 127.0.0.1 --directory "${APT_FIXTURE}" \
              >/tmp/ceasar-apt-fixture.log 2>&1 &
            apt_fixture_pid=$!
            trap "kill ${apt_fixture_pid}" EXIT
            for _ in {1..50}; do
              curl --fail --silent http://127.0.0.1:18080/dists/noble/Release >/dev/null && break
              sleep 0.1
            done

            cd /ceasar-git
            CEASAR_APT_URL=http://127.0.0.1:18080 \
            CEASAR_APT_KEY_URL=http://127.0.0.1:18080/ceasar-archive-keyring.gpg \
              bash install/ceasar-install.sh \
              --hostname ceasar.local.test \
              --email admin@example.com \
              --username admin \
              --password Password123 \
              --interactive no \
              --force \
              --packages "${DEB_PATH}" \
              --clamav no \
              --spamassassin no
          '

      - name: Run BATS test suite
        run: |
          docker exec ceasar-ci bash -lc '
            set -euxo pipefail
            cd /ceasar-git
            if ! command -v bats >/dev/null 2>&1; then
              test/test_helper/bats-core/install.sh /usr/local
            fi
            bats test/test.bats
          '

      - name: Verify installed customer route as the PHP service user
        run: |
          docker exec ceasar-ci bash -lc '
            set -euxo pipefail
            cat >/tmp/customer.json <<"JSON"
            {"schema":1,"enabled":true,"brand_name":"Ceasar","supabase_url":"https://fixture.supabase.co","supabase_publishable_key":"sb_publishable_fixture","terms_url":"https://example.com/terms","privacy_url":"https://example.com/privacy","passkeys_enabled":false,"passkey_rp_id":"example.com","login_url":"https://app.example.com/customer/login","callback_url":"https://login.example.com/auth/callback","account_url":"https://app.example.com/customer/account","worker_api_base":"/api/customer/v1"}
            JSON
            install -o root -g ceasarweb -m 0640 /tmp/customer.json /usr/local/ceasar/conf/customer.json
            sudo -u ceasarweb test -r /usr/local/ceasar/conf/customer.json
            curl --insecure --silent --show-error \
              --resolve app.example.com:8083:127.0.0.1 \
              --dump-header /tmp/customer-login.headers --output /dev/null \
              https://app.example.com:8083/customer/login
            tr -d "\r" </tmp/customer-login.headers | grep -Fx "Location: /customer/login/"
            curl --fail --insecure --silent --show-error --location \
              --resolve app.example.com:8083:127.0.0.1 \
              https://app.example.com:8083/customer/login \
              | grep -Fq "data-customer-auth-form=\"sign-in\""
          '

      - name: Collect logs on failure
        if: failure()
        run: |
          docker exec ceasar-ci bash -lc 'journalctl --no-pager -n 500' || true
          docker exec ceasar-ci bash -lc 'ls -la /root/ceasar_install_backups || true' || true
          docker exec ceasar-ci bash -lc 'tail -n 500 /root/ceasar_install_backups/ceasar_install-*.log || true' || true

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f ceasar-ci || true
